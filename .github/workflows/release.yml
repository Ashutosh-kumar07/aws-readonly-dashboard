name: Release

# Publishing happens only from an intentional release: a pushed v* tag, or a
# manual dispatch. It never runs automatically on a commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish to npm
    runs-on: ubuntu-latest
    # Optional: create a GitHub environment named `npm-publish` with required
    # reviewers and add `environment: npm-publish` here to gate releases behind
    # a manual approval. It is left out so a first release works with no setup.
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC provenance).
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 still
      # ships npm 10.x, so the bundled CLI is too old to authenticate that way.
      - name: Use an npm release that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Verify (lint, types, tests, build)
        run: npm run verify

      - name: Confirm the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version"; exit 1
          fi

      - name: Inspect the package contents
        run: npm pack --dry-run

      # npm provenance attestations require a public source repository, so the
      # flag is only passed when the repository actually is public.
      # Authentication comes from the OIDC token granted by `id-token: write`
      # above, matched against the trusted publisher configured on npmjs.com for
      # this repository and workflow file. No npm token is involved.
      - name: Publish with provenance
        if: ${{ !github.event.repository.private }}
        run: npm publish --provenance --access public --tag "${{ inputs.dist_tag || 'latest' }}"

      - name: Publish (private repository, provenance unavailable)
        if: ${{ github.event.repository.private }}
        run: npm publish --access public --tag "${{ inputs.dist_tag || 'latest' }}"

      - name: Verify the published version
        run: |
          sleep 15
          npm view aws-readonly-dashboard version
