name: Bug report
description: Something in the dashboard does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Please redact AWS account IDs, ARNs, bucket names,
        IP addresses and any other identifying data** — a redacted report is always
        enough.

        Security vulnerabilities should not be filed here; see SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `aws-readonly-dashboard --version`
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v22.11.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / startup
        - Profiles and credentials
        - Billing / Cost
        - Security
        - Compute Optimizer
        - CloudWatch
        - CloudTrail
        - AI insights
        - AWS API usage
        - Settings / local configuration
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact command you ran and what you saw.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Run with `--log-level debug` if useful. Redact anything identifying.
      render: shell
