name: Feature request
description: Suggest a capability or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please note the project's invariants in CONTRIBUTING.md. Proposals that would
        let the application modify AWS, bypass sanitization, or invoke AI without an
        explicit user action are out of scope by design.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in, not only the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Billing / Cost
        - Security checks
        - Compute Optimizer
        - CloudWatch
        - CloudTrail
        - AI insights
        - AWS API usage
        - CLI / configuration
        - UI / UX
        - Other
    validations:
      required: true

  - type: checkboxes
    id: readonly
    attributes:
      label: Read-only confirmation
      options:
        - label: This can be implemented using read-only AWS APIs
          required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
